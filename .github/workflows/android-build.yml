name: Android APK

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create persistent Prime signing key before cache restore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/prime-mobile-signing.jks" ]; then
            keytool -genkeypair -v -storetype JKS -keystore "$HOME/.android/prime-mobile-signing.jks" -storepass android -alias primemobile -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PrimeLauncher Mobile,O=PrimeLauncher,C=US"
          fi
      - name: Restore persistent Prime signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/prime-mobile-signing.jks
          key: prime-mobile-stable-signing-v3
      - name: Verify persistent Prime signing certificate
        run: |
          keytool -list -v -keystore "$HOME/.android/prime-mobile-signing.jks" -storepass android -alias primemobile | grep -E 'SHA256|SHA1'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Node.js for Prime gameplay validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate packaged Prime gameplay JavaScript
        run: |
          node --check app/src/main/assets/prime/prime-world.js
          node tests/prime-mobile-battle-systems-test.cjs
      - name: Build debug APK with the persistent Prime signing key
        env:
          PRIME_SIGNING_KEY: ${{ runner.temp }}/prime-mobile-signing.jks
        run: |
          cp "$HOME/.android/prime-mobile-signing.jks" "$PRIME_SIGNING_KEY"
          gradle --no-daemon assembleDebug
      - name: Prepare stable release asset name
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk PrimeLauncher-Mobile.apk
      - name: Publish APK release for in-app updater
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-${{ github.run_number }}
          name: PrimeLauncher Mobile ${{ github.run_number }}
          generate_release_notes: true
          files: PrimeLauncher-Mobile.apk
          fail_on_unmatched_files: true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrimeLauncher-Mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

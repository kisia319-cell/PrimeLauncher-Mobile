name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore stable debug signing key for seamless sideload updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: prime-mobile-debug-signing-v1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Publish APK release for in-app updater
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-${{ github.run_number }}
          name: PrimeLauncher Mobile ${{ github.run_number }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrimeLauncher-Mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
